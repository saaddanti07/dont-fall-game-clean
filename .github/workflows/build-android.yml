name: Build DON'T FALL Android APK

on:
  push:
    branches: [main, master]
    paths:
      - 'dont-fall-source.txt'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:
    inputs:
      build_mode:
        description: 'Choose TEST or RELEASE'
        required: true
        default: 'test'
        type: choice
        options:
          - test
          - release

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      VITE_ADMOB_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reconstruct and validate source ZIP
        run: |
          test -s dont-fall-source.txt
          base64 --decode dont-fall-source.txt > dont-fall-source.zip
          test -s dont-fall-source.zip
          unzip -t dont-fall-source.zip

      - name: Extract the actual project root
        shell: bash
        run: |
          python3 - <<'PY'
          import zipfile
          import tempfile
          from pathlib import Path, PurePosixPath
          import stat
          import sys

          archive = Path('dont-fall-source.zip')
          temp = Path(tempfile.mkdtemp(prefix='dont-fall-'))

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  p = PurePosixPath(item.filename)
                  if p.is_absolute() or '..' in p.parts:
                      sys.exit('Unsafe path in ZIP: ' + item.filename)
                  if any(part in ('.git', 'node_modules') for part in p.parts):
                      continue
                  mode = item.external_attr >> 16
                  if stat.S_ISLNK(mode):
                      sys.exit('Symbolic link found in ZIP: ' + item.filename)
                  z.extract(item, temp)

          candidates = []
          for package in temp.rglob('package.json'):
              root = package.parent
              required = [
                  root / 'package-lock.json',
                  root / 'capacitor.config.ts',
                  root / 'src',
                  root / 'native-android' / 'MainActivity.kt',
                  root / 'native-android' / 'patch-manifest.py',
                  root / 'native-android' / 'apply-icons.sh',
              ]
              if all(path.exists() for path in required):
                  candidates.append(root)

          if len(candidates) != 1:
              print('Valid project roots found:', [str(p) for p in candidates])
              sys.exit("Could not identify exactly one complete DON'T FALL project root.")

          with open('/tmp/dont-fall-project-root', 'w') as f:
              f.write(str(candidates[0]))
          print('Validated project root:', candidates[0])
          PY
          PROJECT_DIR="$(cat /tmp/dont-fall-project-root)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy project into build workspace
        run: |
          rsync -a --exclude='.github/' "$PROJECT_DIR/" ./
          test -f package.json
          test -f package-lock.json
          test -f capacitor.config.ts
          test -d src
          test -f native-android/MainActivity.kt

      - name: Avoid rewarded-ad preload during gameplay resume
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/game/ads.ts")
          lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
          matches = [
              i for i, line in enumerate(lines)
              if line.strip() == "void this.prepareRewarded(kind);"
          ]

          if len(matches) != 1:
              raise SystemExit(
                  "Expected exactly one immediate rewarded-ad preload call; refusing to patch."
              )

          del lines[matches[0]]
          path.write_text("".join(lines), encoding="utf-8")
          print("Patched src/game/ads.ts: removed immediate rewarded-ad preload.")
          PY

      - name: Inspect gameplay audio and animation lifecycle
        shell: bash
        run: |
          echo "===== GAME AUDIO MODULE ====="
          sed -n '1,300p' src/game/audio.ts
          echo "===== GAME SCREEN LIFECYCLE ====="
          sed -n '1,300p' src/components/GameScreen.tsx
          echo "===== ENGINE LOOP AND AUDIO REFERENCES ====="
          grep -n -C 5 -E 'requestAnimationFrame|cancelAnimationFrame|setInterval|clearInterval|visibilitychange|audio\\.|sfx\\(|music|loop' src/game/engine.ts || true
          echo "===== APP AUDIO AND AD HANDLERS ====="
          sed -n '1,175p' src/App.tsx
          echo "===== AUDIO ENGINE CONTROL METHODS ====="
          grep -n -C 8 -E 'timer|syncMusic|setInterval|clearInterval|suspend|resume|musicOn|sfxOn|export' src/game/audio.ts
          echo "===== AUDIO ENGINE END ====="
          sed -n '300,520p' src/game/audio.ts
          echo "===== GAME ENGINE LOOP / PAUSE ====="
          grep -n -C 12 -E 'requestAnimationFrame|setInterval|clearInterval|setPaused|paused|loop\(' src/game/engine.ts
          echo "===== GAME SCREEN APP STATE / LIFECYCLE ====="
          sed -n '55,180p' src/components/GameScreen.tsx


      - name: Search rewarded ads and button handlers
        run: |
          echo "===== AD AND REWARDED REFERENCES ====="
          grep -RInEi \
            --exclude-dir=node_modules \
            --exclude-dir=.git \
            --exclude='*.map' \
            'rewarded|admob|show.*ad|revive|double.*coin|double.*reward|watch.*ad' \
            src native-android package.json || true

      - name: Fix paused game rendering and suspend audio during rewarded ads
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine = Path("src/game/engine.ts")
          s = engine.read_text()
          old = """  start() {
              this.last = performance.now();
              const loop = (now: number) => {
                const dt = Math.min(0.033, (now - this.last) / 1000);
                this.last = now;
                if (!this.paused && this.state !== "over") this.update(dt);
                this.time += this.paused ? 0 : dt;
                this.render();
                this.raf = requestAnimationFrame(loop);
              };
              this.raf = requestAnimationFrame(loop);
            }

            destroy() {
              cancelAnimationFrame(this.raf);
            }

            setPaused(p: boolean) {
              this.paused = p;
            }"""
          new = """  private running = false;
            private loop = (now: number) => {
              if (!this.running || this.paused) return;
              const dt = Math.min(0.033, (now - this.last) / 1000);
              this.last = now;
              if (this.state !== "over") this.update(dt);
              this.time += dt;
              this.render();
              if (this.running && !this.paused) this.raf = requestAnimationFrame(this.loop);
            };

            start() {
              if (this.running) return;
              this.running = true;
              this.last = performance.now();
              this.raf = requestAnimationFrame(this.loop);
            }

            destroy() {
              this.running = false;
              cancelAnimationFrame(this.raf);
            }

            setPaused(p: boolean) {
              if (this.paused === p) return;
              this.paused = p;
              if (p) {
                cancelAnimationFrame(this.raf);
                this.render();
              } else if (this.running) {
                this.last = performance.now();
                this.raf = requestAnimationFrame(this.loop);
              }
            }"""
          if old not in s:
              raise SystemExit("Game engine loop block did not match exactly; refusing unsafe patch")
          engine.write_text(s.replace(old, new, 1))

          audio = Path("src/game/audio.ts")
          s = audio.read_text()
          anchor = "  configure(s: { musicOn: boolean; sfxOn: boolean; musicVol: number; sfxVol: number }) {"
          methods = """  /** Stop game audio scheduling while a native rewarded ad owns audio focus. */
            pauseForAd() {
              if (this.timer !== null) {
                clearInterval(this.timer);
                this.timer = null;
              }
              if (this.ctx?.state === "running") void this.ctx.suspend();
            }

            /** Resume the existing audio context without changing the player's sound settings. */
            resumeAfterAd() {
              const ctx = this.ctx;
              if (!ctx) return;
              const resume = ctx.state === "suspended" ? ctx.resume() : Promise.resolve();
              void resume.then(() => {
                if (this.ctx !== ctx) return;
                this.nextTime = ctx.currentTime + 0.05;
                this.syncMusic();
              }).catch(() => {
                // Audio can remain unavailable until the next user gesture on some devices.
              });
            }

          """
          if s.count(anchor) != 1:
              raise SystemExit("Audio configure anchor missing or duplicated; refusing unsafe patch")
          audio.write_text(s.replace(anchor, methods + anchor, 1))

          app = Path("src/App.tsx")
          s = app.read_text()
          old_revive = """    setAdBusy(true);
              const reward = await ads.showRewarded("revive");
              setAdBusy(false);"""
          new_revive = """    setAdBusy(true);
              gameRef.current.setPaused(true);
              audio.pauseForAd();
              let reward: Awaited<ReturnType<typeof ads.showRewarded>> = null;
              try {
                reward = await ads.showRewarded("revive");
              } finally {
                audio.resumeAfterAd();
                setAdBusy(false);
              }"""
          if s.count(old_revive) != 1:
              raise SystemExit("Revive ad call did not match exactly; refusing unsafe patch")
          s = s.replace(old_revive, new_revive, 1)
          old_resume = """      setScreen("playing");
              }
            }, [adBusy, screen, pushToasts]);"""
          new_resume = """      setScreen("playing");
                  gameRef.current.setPaused(false);
              }
            }, [adBusy, screen, pushToasts]);"""
          if s.count(old_resume) != 1:
              raise SystemExit("Revive resume point did not match exactly; refusing unsafe patch")
          s = s.replace(old_resume, new_resume, 1)

          old_coins = """    setAdBusy(true);
              const reward = await ads.showRewarded("coins");
              setAdBusy(false);"""
          new_coins = """    setAdBusy(true);
              gameRef.current?.setPaused(true);
              audio.pauseForAd();
              let reward: Awaited<ReturnType<typeof ads.showRewarded>> = null;
              try {
                reward = await ads.showRewarded("coins");
              } finally {
                audio.resumeAfterAd();
                setAdBusy(false);
              }"""
          if s.count(old_coins) != 1:
              raise SystemExit("Double-coins ad call did not match exactly; refusing unsafe patch")
          app.write_text(s.replace(old_coins, new_coins, 1))
          print("Patched game RAF pause/resume and rewarded-ad audio lifecycle.")
          PY
          npx tsc --noEmit

      - name: Inspect rewarded ad implementation
        run: |
          echo "===== ADS SERVICE ====="
          sed -n '1,330p' src/game/ads.ts
          echo "===== APP REWARDED HANDLERS ====="
          sed -n '100,165p' src/App.tsx
          echo "===== GAME OVER BUTTONS ====="
          sed -n '90,120p' src/components/GameOver.tsx
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect AdMob environment usage
        run: |
          echo "===== ADMOB ENVIRONMENT REFERENCES ====="
          grep -RIn --exclude-dir=node_modules --exclude-dir=.git --exclude='*.map' 'VITE_ADMOB_ENV' . || true

      - name: Build web game
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Apply native Android and AdMob configuration
        run: |
          mkdir -p android/app/src/main/java/com/dontfall/game
          rm -f android/app/src/main/java/com/dontfall/game/MainActivity.java
          rm -f android/app/src/main/java/com/dontfall/game/MainActivity.kt
          cp native-android/MainActivity.kt android/app/src/main/java/com/dontfall/game/MainActivity.kt
          python3 native-android/patch-manifest.py

      - name: Apply launcher icons
        run: bash native-android/apply-icons.sh

      - name: Inspect Android Gradle configuration
        run: |
          echo "===== APP GRADLE ====="
          cat android/app/build.gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode Android signing key
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          mkdir -p android/app
          python3 - <<'PY'
          import os
          import base64

          raw = os.environ.get("KEYSTORE_B64", "")
          lines = raw.strip().splitlines()
          body = []

          for line in lines:
              line = line.strip().lstrip("\ufeff")
              if not line:
                  continue
              if line.startswith("-----BEGIN ") or line.startswith("-----END "):
                  continue
              body.append(line)

          encoded = "".join(body)
          if not encoded or len(encoded) % 4 != 0:
              raise SystemExit("Invalid Base64 length in ANDROID_KEYSTORE_BASE64.")

          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception:
              raise SystemExit("ANDROID_KEYSTORE_BASE64 is not valid Base64. Replace the GitHub secret with only the Base64 text between the BEGIN and END lines.")

          if not data:
              raise SystemExit("Decoded keystore is empty.")

          path = "android/app/dont-fall-release.jks"
          with open(path, "wb") as f:
              f.write(data)

          print("Signing key decoded. Checking keystore...")
          PY
          keytool -list -keystore android/app/dont-fall-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/android/app/dont-fall-release.jks" >> "$GITHUB_ENV"

      - name: Build debug APK (TEST)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'test' }}
        run: gradle -p android assembleDebug

      - name: Build signed release APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/dont-fall-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android assembleRelease

      - name: Upload TEST APK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_mode == 'test' }}
        uses: actions/upload-artifact@v4
        with:
          name: dont-fall-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload RELEASE APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mode == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: dont-fall-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
